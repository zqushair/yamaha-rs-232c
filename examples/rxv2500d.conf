# rxv2500d configuration file (KEY=VALUE)
# Default location: /etc/rxv2500d.conf  (override with --config <path>)
# Every key can also be set via an environment variable prefixed with
# RXV2500D_ (e.g. RXV2500D_MQTT_HOST), which takes precedence over this file.

# --- MQTT broker ------------------------------------------------------------
MQTT_HOST=localhost
MQTT_PORT=1883
MQTT_USER=
MQTT_PASS=
CLIENT_ID=rxv2500d

# --- Topic naming -------------------------------------------------------------
ROOT=rxv2500
DISCOVERY_PREFIX=homeassistant

# --- Serial link (ser2net TCP endpoint in front of the RS-232 cable) ---------
SERIAL_HOST=localhost
SERIAL_PORT=2500

# --- Daemon behaviour ---------------------------------------------------------
STATE_FILE=/var/lib/rxv2500d/state.json
DUMP_WAIT=8                 # seconds to wait for the receiver connection dump
SEED_REFRESH_INPUT=false    # resend stored input on reconnect (can change input!)
RESEED_RESTART_SER2NET=false  # allow "sudo -n systemctl restart ser2net" on reseed
LOG_LEVEL=INFO
