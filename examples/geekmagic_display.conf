# geekmagic_display configuration file (KEY=VALUE)
# Default location: /etc/geekmagic_display.conf  (override with --config <path>)
# Every key can also be set via an environment variable prefixed with
# GEEKMAGIC_ (e.g. GEEKMAGIC_DISPLAY_HOST), which takes precedence over this file.

# --- MQTT broker ------------------------------------------------------------
MQTT_HOST=localhost
MQTT_PORT=1883
MQTT_USER=
MQTT_PASS=
CLIENT_ID=geekmagic_display

# --- Topic naming -------------------------------------------------------------
ROOT=rxv2500

# --- GeekMagic display --------------------------------------------------------
# IP address of the GeekMagic SmallTV Pro (required)
DISPLAY_HOST=
DISPLAY_PORT=80

# --- Daemon behaviour ---------------------------------------------------------
DEBOUNCE_MS=400             # coalesce bursts of state changes (ms)
PUSH_MIN_INTERVAL=0.6       # min seconds between uploads
WATCHDOG_INTERVAL=60        # re-assert theme/image this often (s)
BRIGHTNESS=                 # optional, 0-100, set on start
STANDBY_MODE=clock          # 'clock' = show clock on standby, 'card' = always show card
BACKUP_DIR=/var/lib/geekmagic_display/album_backup
JPEG_QUALITY=85

# --- Pages & refresh ----------------------------------------------------------
# Dashboard page: one dense 240x240 card (clock, volume, DSP mode, status
# chips).  PAGES=1 renders just it.  PAGES=2,3,4 puts the original Sound
# Field/Status/Clock cards back in the album for the touch button to cycle
# (short = next, double = prev) — but note the stock firmware only re-decodes
# an image when the album advances or the theme is re-entered, so with
# multiple pages live updates only reach the page the button lands on.
PAGES=1                    # page IDs in the album (1 = dashboard)
PAGE=1                     # initial page
# Single-page mode configures the album as a slideshow that re-reads the one
# image every REFRESH_INTERVAL seconds — the self-refresh that makes live
# updates work (the firmware never redraws a file replaced in place, and a
# theme re-assert while already in the theme is a no-op).
REFRESH_INTERVAL=1         # seconds between the display's self-refresh reads
# BUTTON_MODE:
#   native  = stock firmware: short-press cycles album images natively
#             (multi-page only; harmless with one image)  [default]
#   poll    = fast-poll app.json; theme drift counts as a press (fallback)
#   off     = no button handling
BUTTON_MODE=native
BUTTON_POLL_INTERVAL=0.5    # poll-mode only: seconds between app.json reads

# --- Fonts --------------------------------------------------------------------
FONT_BOLD=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
FONT_REGULAR=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf

LOG_LEVEL=INFO
